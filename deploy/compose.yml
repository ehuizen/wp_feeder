# Production stack on the VPS: the WPFeeder app and its Postgres. Secrets come from .env next to this file.
name: wpfeeder

services:
  app:
    # Built on the VPS with `docker build -t wpfeeder:live .`; never pulled from a registry.
    image: wpfeeder:live
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    # Loopback only: Caddy on the host is the single public entry point.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wpfeeder
      POSTGRES_DB: wpfeeder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpfeeder -d wpfeeder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
