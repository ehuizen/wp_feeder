# Runs typecheck, lint, tests and a production build on every pull request and every push to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wpfeeder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Dummy values only: tests mock Auth0 and WordPress, and the key is used for a throwaway database.
      - name: Write server/.env.test
        run: |
          cat > server/.env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/wpfeeder_test
          AUTH0_ISSUER_BASE_URL=https://tenant.example
          AUTH0_CLIENT_ID=ci-client-id
          AUTH0_CLIENT_SECRET=ci-client-secret
          SESSION_SECRET=ci-session-secret-that-is-at-least-32-chars
          BASE_URL=http://localhost:5173
          ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EOF

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
