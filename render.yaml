# Render Blueprint: one web service (API + built client) and one Postgres. See docs/deploy.md.
# Nothing in the app depends on Render: it only reads the env vars below, so it runs the same on a VPS.
services:
  - type: web
    name: wpfeeder
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start # runs pending migrations, then the server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: wpfeeder-db
          property: connectionString # the internal URL, private to Render's network
      - key: DATABASE_SSL
        value: "false" # internal network; set true if you switch to an external database URL
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false # e.g. https://wpfeeder.onrender.com
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false # set it yourself and keep a copy: without it, stored passwords can't be decrypted

databases:
  - name: wpfeeder-db
    plan: free
    databaseName: wpfeeder
